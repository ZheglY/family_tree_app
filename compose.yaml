services:
  family-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: family_tree
      POSTGRES_USER: family_tree
      POSTGRES_PASSWORD: family_tree
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_tree -d family_tree"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - family-postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro

  auth-redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  media-s3:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: family-tree
      MINIO_ROOT_PASSWORD: family-tree-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - family-media-data:/data

volumes:
  family-postgres-data:
  family-media-data:
