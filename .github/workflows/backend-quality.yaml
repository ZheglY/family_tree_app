name: Backend quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-image:
    name: Production container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Build production image
        run: >-
          docker build
          --build-arg VERSION=ci
          --build-arg VCS_REF=${GITHUB_SHA}
          --tag family-tree-backend:${GITHUB_SHA}
          .
      - name: Verify runtime contract
        run: |
          image="family-tree-backend:${GITHUB_SHA}"
          docker run --rm --read-only --tmpfs /tmp:mode=1777 --entrypoint /bin/sh "$image" -c \
            'test "$(id -u)" = 10001 && mkdir -p /tmp/family-tree-logs && test -x /app/family-api && test -x /app/family-worker && test -x /app/family-migrate && test -x /app/family-restore-backup'
      - name: Validate staging Compose template
        env:
          FAMILY_TREE_IMAGE: family-tree-backend:ci
          STAGING_ENV_FILE: ${{ github.workspace }}/deploy/staging/staging.env.example
        run: docker compose -f deploy/staging/compose.yaml config --quiet

  static-and-race:
    name: Static analysis and race tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Run static analysis
        run: go vet ./...
      - name: Run race detector
        run: go test -race ./... -count=1 -timeout=240s

  postgres-and-s3:
    name: PostgreSQL and S3 integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: family_tree_test
          POSTGRES_USER: family_tree
          POSTGRES_PASSWORD: family_tree
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U family_tree -d family_tree_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Start S3-compatible MinIO
        run: |
          docker run --detach --name family-media-ci \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=family-tree \
            --env MINIO_ROOT_PASSWORD=family-tree-secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs family-media-ci
          exit 1
      - name: Run complete test suite
        env:
          FAMILY_TEST_DATABASE_URL: postgres://family_tree:family_tree@localhost:5434/family_tree_test?sslmode=disable
          S3_TEST_ENDPOINT: http://localhost:9000
          S3_TEST_REGION: ru-central1
          S3_TEST_BUCKET: family-tree-media-test
          S3_TEST_ACCESS_KEY_ID: family-tree
          S3_TEST_SECRET_ACCESS_KEY: family-tree-secret
        run: go test ./... -count=1 -timeout=240s
      - name: Run PostgreSQL and S3 restore drill
        shell: pwsh
        env:
          SOURCE_POSTGRES_URL: postgres://family_tree:family_tree@localhost:5434/family_tree_test?sslmode=disable
          TARGET_POSTGRES_URL: postgres://family_tree:family_tree@localhost:5434/family_tree_restore?sslmode=disable
          AWS_ACCESS_KEY_ID: family-tree
          AWS_SECRET_ACCESS_KEY: family-tree-secret
          AWS_DEFAULT_REGION: ru-central1
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          $env:PATH = "/usr/lib/postgresql/17/bin:" + $env:PATH

          $env:POSTGRES_URL = $env:SOURCE_POSTGRES_URL
          go run ./cmd/migrate up
          if ($LASTEXITCODE -ne 0) { throw "source migrations failed" }

          $env:PGPASSWORD = "family_tree"
          psql `
            --host localhost `
            --port 5434 `
            --username family_tree `
            --dbname postgres `
            --command "CREATE DATABASE family_tree_restore"
          if ($LASTEXITCODE -ne 0) { throw "restore database creation failed" }
          psql `
            --host localhost `
            --port 5434 `
            --username family_tree `
            --dbname family_tree_test `
            --command @"
          INSERT INTO family_trees (
            id, name, owner_user_id, locale, timezone, created_at, updated_at
          ) VALUES (
            '11111111-1111-4111-8111-111111111111', 'Restore drill',
            '22222222-2222-4222-8222-222222222222', 'ru-RU', 'Europe/Moscow',
            CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
          );
          INSERT INTO tree_members (
            tree_id, user_id, role, status, created_at, accepted_at
          ) VALUES (
            '11111111-1111-4111-8111-111111111111',
            '22222222-2222-4222-8222-222222222222',
            'owner', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
          );
          "@
          if ($LASTEXITCODE -ne 0) { throw "restore fixture insert failed" }

          aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket family-tree-drill-source
          aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket family-tree-drill-target
          $fixture = Join-Path $env:RUNNER_TEMP "restore-drill-object.txt"
          [System.IO.File]::WriteAllText($fixture, "checksummed restore drill", [System.Text.UTF8Encoding]::new($false))
          $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $fixture).Hash.ToLowerInvariant()
          aws --endpoint-url http://localhost:9000 s3api put-object `
            --bucket family-tree-drill-source `
            --key trees/11111111-1111-4111-8111-111111111111/media/drill.txt `
            --body $fixture `
            --content-type text/plain `
            --metadata "sha256=$checksum"
          if ($LASTEXITCODE -ne 0) { throw "restore fixture upload failed" }

          ./scripts/infrastructure-backup-drill.ps1 `
            -BackupDirectory (Join-Path $env:RUNNER_TEMP "family-tree-infrastructure-backup") `
            -SourcePostgresURL $env:SOURCE_POSTGRES_URL `
            -TargetPostgresURL $env:TARGET_POSTGRES_URL `
            -SourceBucket family-tree-drill-source `
            -TargetBucket family-tree-drill-target `
            -S3Endpoint http://localhost:9000 `
            -S3Region ru-central1 `
            -PgBinDirectory /usr/lib/postgresql/17/bin `
            -ConfirmQuiesced
